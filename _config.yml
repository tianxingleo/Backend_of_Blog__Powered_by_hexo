# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Tianxingleo的Blog
subtitle: ""
description: "天马行空（tianxingleo）的个人博客，记录学习笔记、项目实践与生活随笔，涵盖 3D 重建、计算机视觉、编程算法与日常折腾。"
keywords:
  - tianxingleo
  - 博客
  - 3DGS
  - 三维重建
  - 计算机视觉
  - 编程
  - 学习笔记
author: Tianxingleo
language: zh-CN
timezone: "Asia/Shanghai"

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://tianxingleo.top
permalink: posts/:hash/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "mtime"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include: []
exclude: []
ignore: []

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: anzhiyu

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:tianxingleo/tianxingleo.github.io.git
  branch: main # 或者 master，取决于你的 GitHub Pages 仓库设置

katex:
  enable: false
  copy_tex: false
  mhchem: true # 启用化学扩展
  # 性能优化 2026-10：禁用插件的全局 CSS 注入（该插件无视 enable 开关，会给每个页面加 CSS）。
  # 必须是 truthy 字符串——空字符串会被插件的 `||` 穿透回退到默认 CDN。
  # 公式页面的 CSS 改由主题按需引入（见 mark_katex.js + head.pug 的 page.katex 判断）。
  stylesheet_fragment: "<!-- KaTeX stylesheet loads on demand for math posts only -->"
  cdn:
    css: https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css
    js: https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
    mhchem: https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js

algolia:
  appId: "66YB7CN8AP"
  apiKey: "61956196bfa43507ef197aade2f06e78"
  # SECURITY: 管理员密钥禁止入库！推送索引时请临时在本地填写 adminApiKey（不要提交），
  # 用完即删。原密钥已泄露，请务必去 Algolia 后台吊销重建。
  chunkSize: 5000
  indexName: "my-hexo-blog"
  fields:
    - content:strip:truncate,0,500
    - excerpt:strip
    - gallery
    - permalink
    - photos
    - slug
    - tags
    - title

# toc:
#   maxdepth: 2
#   class: toc

markdown_it_plus:
  plugins:
    - plugin:
        name: markdown-it-toc-and-anchor
        enable: true
        options:
          anchorLink: false
          tocFirstLevel: 2

# RSS Feed 配置
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: " "
  order_by: -date
  icon: icon.png
  autodiscovery: true
  template:

# Sitemap（搜索引擎站点地图）
sitemap:
  path: sitemap.xml
  tags: true
  categories: true

# 全站压缩（HTML/CSS/JS 压缩，图片远程存放故不压图）
html_minifier:
  enable: true
  ignore_error: false
  silent: false
  exclude:
css_minifier:
  enable: true
  silent: false
  exclude:
    - "*.min.css"
js_minifier:
  enable: true
  mangle: true
  silent: false
  exclude:
    - "*.min.js"
image_minifier:
  enable: false
